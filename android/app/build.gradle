plugins { id 'com.android.application' }
if(project.hasProperty('buildOutput')) layout.buildDirectory.set(file(project.property('buildOutput')))
def releaseConfig = new Properties()
def configFile = rootProject.file(project.findProperty('releaseConfigFile') ?: 'release.properties')
if (configFile.exists()) configFile.withInputStream { releaseConfig.load(it) }
def htmlEscape = { value -> value.toString().replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;').replace("'",'&#39;') }
def validatePublicDetails = {
 def email = releaseConfig.getProperty('supportEmail','').trim()
 if(!(email ==~ /[A-Za-z0-9.!#$%&'*+\/=?^_`{|}~-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/)) throw new GradleException('Set a valid public supportEmail in android/release.properties.')
 try {
  def uri = new URI(releaseConfig.getProperty('privacyPolicyUrl','').trim())
  if(uri.scheme != 'https' || !uri.host || uri.userInfo || uri.host in ['localhost','127.0.0.1','appassets.androidplatform.net'] || uri.host.endsWith('.example')) throw new IllegalArgumentException()
 } catch(Exception ignored) { throw new GradleException('Set privacyPolicyUrl to the public HTTPS privacy page, without embedded credentials.') }
}
def renderPublicDetails = { line ->
 if(releaseConfig.getProperty('supportEmail') && releaseConfig.getProperty('privacyPolicyUrl')) {
  validatePublicDetails()
  line = line.replaceAll(/<p data-release-notice>.*?<\/p>/, '')
  line = line.replaceAll(/<span data-support-contact>.*?<\/span>/, java.util.regex.Matcher.quoteReplacement('<a href="mailto:' + htmlEscape(releaseConfig.supportEmail.trim()) + '">' + htmlEscape(releaseConfig.supportEmail.trim()) + '</a>'))
  line = line.replace('data-public-policy href="privacy.html"', 'data-public-policy href="' + htmlEscape(releaseConfig.privacyPolicyUrl.trim()) + '"')
 }
 line
}
android {
 namespace 'com.lalaolemur.blockblock'
 compileSdk 36
 defaultConfig {
  applicationId releaseConfig.getProperty('applicationId','com.lalaolemur.blockblock')
  minSdk 24
  targetSdk 36
  versionCode 6
  versionName '1.4.0'
 }
 buildFeatures { buildConfig true }
 signingConfigs {
  upload {
   if(releaseConfig.getProperty('uploadStoreFile')) storeFile rootProject.file(releaseConfig.uploadStoreFile)
   storePassword System.getenv('BLOCKBLOCK_STORE_PASSWORD')
   keyAlias releaseConfig.getProperty('uploadKeyAlias','')
   keyPassword System.getenv('BLOCKBLOCK_KEY_PASSWORD')
  }
 }
 buildTypes {
  debug {
   applicationIdSuffix '.debug'
  }
  release {
   signingConfig signingConfigs.upload
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyGame', Sync) {
 inputs.property('supportEmail', releaseConfig.getProperty('supportEmail',''))
 inputs.property('privacyPolicyUrl', releaseConfig.getProperty('privacyPolicyUrl',''))
 from(rootProject.projectDir.parentFile) {
  include '*.html','*.css','*.js','icon*.png','*.svg','manifest.webmanifest'
  exclude '*.test.js','server.js','sw.js','store.js','tip-catalog.js'
 }
 into layout.buildDirectory.dir('generated/gameAssets/game')
 filesMatching(['privacy.html','support.html']) { filter { line -> renderPublicDetails(line) } }
}
tasks.register('preparePublicPolicy', Copy) {
 inputs.property('supportEmail', releaseConfig.getProperty('supportEmail',''))
 inputs.property('privacyPolicyUrl', releaseConfig.getProperty('privacyPolicyUrl',''))
 doFirst { validatePublicDetails() }
 from(rootProject.projectDir.parentFile) { include 'privacy.html','support.html','policy.css' }
 into rootProject.file(project.findProperty('publicPolicyOutput') ?: '../dist/privacy-policy')
 filesMatching(['privacy.html','support.html']) {
  filter { line -> renderPublicDetails(line).replace('<a href="index.html">Back to Block Block</a>', 'Block Block by Lalao Lemur') }
 }
}
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets').get().asFile
tasks.named('preBuild').configure { dependsOn 'copyGame' }
tasks.register('validateRelease') {
 doLast {
  ['applicationId','privacyPolicyUrl','supportEmail','targetAudience','uploadStoreFile','uploadKeyAlias'].each { key ->
   if(!releaseConfig.getProperty(key)?.trim()) throw new GradleException("Set ${key} in android/release.properties before release.")
  }
  if(releaseConfig.applicationId != 'com.lalaolemur.blockblock') throw new GradleException('Keep the registered Play package identity.')
  validatePublicDetails()
  if(!System.getenv('BLOCKBLOCK_STORE_PASSWORD') || !System.getenv('BLOCKBLOCK_KEY_PASSWORD')) throw new GradleException('Set signing passwords in BLOCKBLOCK_STORE_PASSWORD and BLOCKBLOCK_KEY_PASSWORD.')
  if(!rootProject.file(releaseConfig.uploadStoreFile).isFile()) throw new GradleException('Upload keystore file is missing.')
  if(releaseConfig.targetAudience != 'mixed') throw new GradleException('Set targetAudience=mixed for the confirmed child-and-older audience. Complete the target-audience declarations before publication.')
 }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'validateRelease' }
dependencies {
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.webkit:webkit:1.14.0'
}


